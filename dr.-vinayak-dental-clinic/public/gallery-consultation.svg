<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="consultBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#consultBg)" />
  
  <!-- Desk -->
  <rect x="140" y="320" width="520" height="20" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
  <rect x="180" y="340" width="440" height="180" fill="#0F2942" rx="8" />

  <!-- Doctor Chair & Patient Chairs -->
  <rect x="330" y="240" width="140" height="80" rx="12" fill="#1E293B" />
  <ellipse cx="400" cy="230" rx="40" ry="16" fill="#334155" />

  <!-- Diagnostic Screen / X-Ray Viewer on Desk -->
  <g transform="translate(440, 160)">
    <rect width="180" height="130" rx="8" fill="#0F172A" stroke="#475569" stroke-width="4" />
    <!-- Radiograph tooth glow -->
    <rect x="10" y="10" width="160" height="110" fill="#0284C7" opacity="0.8" rx="4" />
    <path d="M90 30 C75 30 70 40 70 55 C70 70 75 85 80 100 L90 90 L100 100 C105 85 110 70 110 55 C110 40 105 30 90 30 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Stand -->
    <rect x="80" y="130" width="20" height="30" fill="#475569" />
    <ellipse cx="90" cy="160" rx="40" ry="6" fill="#334155" />
  </g>

  <!-- Tooth Anatomical Model on Desk -->
  <g transform="translate(240, 240)">
    <ellipse cx="30" cy="75" rx="30" ry="8" fill="#CBD5E1" />
    <path d="M30 15 C15 15 10 25 10 40 C10 55 15 65 22 75 L30 70 L38 75 C45 65 50 55 50 40 C50 25 45 15 30 15 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <path d="M22 35 Q30 42 38 35" fill="none" stroke="#0D9488" stroke-width="2" />
  </g>

  <!-- Clean consultation header card -->
  <g transform="translate(60, 50)">
    <rect width="280" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="35" cy="25" r="14" fill="#0D9488" />
    <text x="35" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rx</text>
    <text x="65" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F2942">Diagnostic Consultation</text>
    <text x="65" y="38" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748B">Personalized oral health review</text>
  </g>
</svg>
