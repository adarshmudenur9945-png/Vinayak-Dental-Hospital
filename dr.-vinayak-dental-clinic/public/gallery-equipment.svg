<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="eqWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#eqWall)" />

  <!-- Sterilization Counter -->
  <rect x="80" y="280" width="640" height="260" rx="12" fill="#0F2942" />
  <rect x="60" y="260" width="680" height="24" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />

  <!-- Class B Autoclave Unit -->
  <g transform="translate(140, 100)">
    <rect width="260" height="160" rx="16" fill="url(#metal)" stroke="#64748B" stroke-width="3" />
    <!-- Chamber Door Round Glass -->
    <circle cx="90" cy="80" r="50" fill="#0F2942" stroke="#64748B" stroke-width="6" />
    <circle cx="90" cy="80" r="35" fill="#38BDF8" opacity="0.3" />
    <ellipse cx="80" cy="70" rx="15" ry="6" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, 80, 70)" />
    <!-- Digital Control Screen -->
    <rect x="170" y="40" width="70" height="40" rx="4" fill="#0284C7" />
    <text x="205" y="64" font-family="monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">134°C</text>
    <circle cx="185" cy="110" r="8" fill="#10B981" />
    <circle cx="215" cy="110" r="8" fill="#0D9488" />
  </g>

  <!-- Ultrasonic Scaler & Sterile Cassette Trays -->
  <g transform="translate(460, 140)">
    <!-- Ultrasonic Bath Unit -->
    <rect width="180" height="120" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <rect x="20" y="20" width="140" height="60" rx="6" fill="#0D9488" opacity="0.3" />
    <text x="90" y="105" font-family="sans-serif" font-size="11" font-weight="600" fill="#0F2942" text-anchor="middle">Ultrasonic Cleaner</text>
  </g>

  <!-- Sterile Hygiene Stamp Badge -->
  <g transform="translate(80, 40)">
    <rect width="320" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="30" cy="23" r="12" fill="#10B981" />
    <path d="M24 23 L28 27 L36 19" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="52" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F2942">Sterile Instrument Protocol</text>
    <text x="52" y="36" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">Autoclaved & Individually Pouched</text>
  </g>
</svg>
