<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="800" height="420" fill="url(#wallGrad)" />
  <!-- Architectural Window -->
  <rect x="520" y="60" width="220" height="260" rx="8" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="4" />
  <line x1="630" y1="60" x2="630" y2="320" stroke="#BAE6FD" stroke-width="3" />
  <line x1="520" y1="190" x2="740" y2="190" stroke="#BAE6FD" stroke-width="3" />

  <!-- Baseboard & Floor -->
  <rect y="415" width="800" height="10" fill="#64748B" />
  <rect y="425" width="800" height="175" fill="url(#floorGrad)" />

  <!-- Modern Dental Chair -->
  <g transform="translate(180, 160)">
    <!-- Base -->
    <ellipse cx="200" cy="300" rx="110" ry="24" fill="#334155" />
    <rect x="185" y="220" width="30" height="80" rx="4" fill="#64748B" />
    <!-- Chair Contour -->
    <path d="M70 210 Q140 240 240 220 L310 245 C320 250 335 240 330 225 L300 170 Q240 180 180 170 L110 110 C95 95 70 115 80 135 Z" fill="url(#tealGrad)" />
    <!-- Headrest -->
    <ellipse cx="85" cy="100" rx="35" ry="22" fill="#0F2942" />
    <path d="M85 100 L95 125" stroke="#94A3B8" stroke-width="4" />
    <!-- Footrest Area -->
    <rect x="290" y="230" width="40" height="20" rx="6" fill="#334155" />
  </g>

  <!-- Overhead Dental Examination Light -->
  <g transform="translate(380, 50)">
    <circle cx="20" cy="20" r="10" fill="#475569" />
    <path d="M20 20 L-40 110 L-20 180" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
    <!-- Light Head -->
    <ellipse cx="-20" cy="185" rx="45" ry="20" fill="#0F2942" />
    <ellipse cx="-20" cy="188" rx="36" ry="12" fill="#FEF08A" opacity="0.9" />
    <!-- Light Beam -->
    <polygon points="-50,195 10,195 40,360 -120,360" fill="#FEF08A" opacity="0.12" />
  </g>

  <!-- Dental Unit Tray and Instruments -->
  <g transform="translate(480, 260)">
    <rect x="0" y="110" width="16" height="110" fill="#64748B" />
    <ellipse cx="8" cy="220" rx="40" ry="12" fill="#334155" />
    <rect x="-40" y="90" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Handpieces -->
    <line x1="-30" y1="85" x2="-30" y2="70" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <line x1="-15" y1="85" x2="-15" y2="65" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="85" x2="0" y2="72" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sanitation / Clean Seal Label -->
  <g transform="translate(40, 40)">
    <rect width="210" height="42" rx="8" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" />
    <circle cx="26" cy="21" r="10" fill="#0D9488" />
    <path d="M22 21 L25 24 L30 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#0F2942">Sterile Treatment Suite</text>
  </g>
</svg>
